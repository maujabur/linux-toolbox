name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar shellcheck, shfmt e tmux (somente no runner)
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt tmux
      - name: Executar testes
        env:
          REQUIRE_LINT: "1"
        run: bash tests/run.sh

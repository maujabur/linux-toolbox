# linux-toolbox — tmux
# Mouse: seleção de painéis, redimensionamento e rolagem
set -g mouse on

# Numeração de janelas e painéis a partir de 1
set -g base-index 1
setw -g pane-base-index 1

# Elimina lacunas na numeração das janelas
set -g renumber-windows on

# Histórico de rolagem
set -g history-limit 20000

# Reduz a espera para interpretar a tecla Esc
set -sg escape-time 10

# 256 cores (exige entrada tmux-256color no terminfo)
set -g default-terminal "tmux-256color"

# Frequência de atualização da barra de status
set -g status-interval 5

# Ctrl+B, depois r: recarrega esta configuração
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Configuração recarregada"

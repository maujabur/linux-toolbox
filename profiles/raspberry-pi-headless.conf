# Perfil: Raspberry Pi sem desktop (headless).
# Formato: "componente = nível". Níveis: obrigatorio, recomendado, opcional.
# Opcionais só entram com --with NOME. Comentários começam com #.
# Exige Debian/Raspberry Pi OS em um Raspberry Pi (checado em
# /proc/device-tree/model). Sem pacotes de desktop. Ajustes de hardware,
# boot e serviços ficam fora deste perfil (ver docs/architecture.md).

[perfil]
descricao = Raspberry Pi headless (sem desktop)
requer    = debian, raspberry-pi

# Instalados com apt-get (usam sudo)
[pacotes]
base        = obrigatorio   # git, curl, tmux, htop, btop, jq, rsync...
development = opcional      # build-essential e python3 ocupam espaço no cartão SD
agents      = opcional      # ferramentas de pesquisa/validação para depurar o Pi

# Ajustes apenas no seu HOME (sem sudo)
[usuario]
bash = recomendado          # aliases pessoais no ~/.bashrc
tmux = recomendado          # link para ~/.config/tmux/tmux.conf
git  = recomendado          # aliases e padrões seguros; não define identidade
fd   = opcional             # link ~/.local/bin/fd; exige fd-find (pacote agents)

# Perfil: Debian Server (sem interface gráfica).
# Formato: "componente = nível". Níveis: obrigatorio, recomendado, opcional.
# Opcionais só entram com --with NOME. Comentários começam com #.
# Ainda não há lista de pacotes própria de servidor; SSH, serviços e rede são
# ajustes de sistema e não fazem parte deste perfil (ver docs/architecture.md).

[perfil]
descricao = Debian Server, sem desktop
requer    = debian

# Instalados com apt-get (usam sudo)
[pacotes]
base        = obrigatorio   # git, curl, tmux, htop, btop, jq, rsync...
development = opcional      # build-essential, python3, pipx
agents      = opcional      # ripgrep, fd-find, jq, yq, shellcheck, shfmt...

# Ajustes apenas no seu HOME (sem sudo)
[usuario]
bash = recomendado          # aliases pessoais no ~/.bashrc
tmux = recomendado          # link para ~/.config/tmux/tmux.conf
git  = recomendado          # aliases e padrões seguros; não define identidade
fd   = opcional             # link ~/.local/bin/fd; exige fd-find (pacote agents)
